name: Build & Sign APK

on:
  push:
    branches: [main]
    paths:
      - 'androidtv/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'androidtv/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a signed release APK (requires keystore secrets)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: androidtv
    env:
      ENKTEL_KEYSTORE: ${{ github.workspace }}/enktel-release.jks
      ENKTEL_KEYSTORE_PASS: ${{ secrets.ENKTEL_KEYSTORE_PASS }}
      ENKTEL_KEY_PASS: ${{ secrets.ENKTEL_KEY_PASS }}
      ENKTEL_KEY_ALIAS: ${{ secrets.ENKTEL_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The FFmpeg decoder is a checked-in binary compiled against one specific
      # media3 version, and the two can drift apart silently: bumping media3 in
      # the version catalogue still compiles, still links, still passes lint,
      # and then fails on a real device when the renderer meets a media3 ABI it
      # was not built for. Nothing else in the build notices, so this does.
      # String comparison, so it costs a second and runs before anything else.
      - name: Check the FFmpeg decoder matches media3
        run: |
          # Paths are relative to androidtv — this job sets working-directory,
          # so repo-root paths resolve to androidtv/androidtv/... and find
          # nothing.
          AAR="$(ls app/libs/media3-decoder-ffmpeg-*.aar 2>/dev/null | head -1)"
          if [ -z "$AAR" ]; then
            echo "::error::No media3-decoder-ffmpeg AAR in androidtv/app/libs. Build one with build-ffmpeg-extension.yml." >&2
            exit 1
          fi
          AAR_VER="$(basename "$AAR" .aar | sed 's/^media3-decoder-ffmpeg-//')"
          MEDIA3_VER="$(grep -oP '^media3\s*=\s*"\K[^"]+' gradle/libs.versions.toml | head -1)"
          echo "AAR $AAR_VER vs media3 $MEDIA3_VER"
          if [ "$AAR_VER" != "$MEDIA3_VER" ]; then
            echo "::error::FFmpeg decoder was built against media3 $AAR_VER but the app uses $MEDIA3_VER. Re-run build-ffmpeg-extension.yml with media3_ref=$MEDIA3_VER and commit the result, or the decoder will fail at runtime." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 37.1
        # The runner image ships an older platform set. core-ktx 1.19 and
        # lifecycle 2.11 refuse to be consumed below API 37, so the compile
        # target has to be present before Gradle resolves anything.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" "build-tools;37.0.0"
        working-directory: .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Lint (both flavors, release variant)
        run: ./gradlew :app:lintTvRelease :app:lintMobileRelease --no-daemon

      - name: Unit tests
        run: ./gradlew :app:testTvDebugUnitTest :app:testMobileDebugUnitTest --no-daemon

      # Room writes app/schemas/<db>/<version>.json during KSP, and those files
      # are committed so an entity change without a matching Migration shows up
      # as a reviewable diff instead of tripping fallbackToDestructiveMigration
      # on someone's device. Nothing was checking that they actually got
      # committed, and they hadn't been: the database reached version 15 while
      # the repo still only carried exports up to 13. Room's migration tests
      # read these files, so the two newest schemas had nothing to test against.
      #
      # --no-build-cache is the whole trick. The schema is written as a side
      # effect to a directory outside build/, so a cache hit on kspTvDebugKotlin
      # restores the task's declared outputs, never writes the schema, and
      # leaves the tree clean — the check would pass without having looked at
      # anything. Forcing real execution makes both failure modes visible in one
      # `git status`: a version bump with no committed export appears as an
      # untracked file, and an entity change under an unchanged version appears
      # as a modified one.
      - name: Check the exported Room schemas are committed
        run: |
          ./gradlew :app:kspTvDebugKotlin --no-daemon --no-build-cache
          DIRTY="$(git status --porcelain app/schemas)"
          if [ -n "$DIRTY" ]; then
            echo "::error::app/schemas does not match what the build produced. Run ./gradlew :app:kspTvDebugKotlin --no-build-cache and commit the result." >&2
            echo "$DIRTY" >&2
            exit 1
          fi

      - name: Build debug APKs (tv + mobile)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.release != 'true' }}
        run: ./gradlew :app:assembleTvDebug :app:assembleMobileDebug --no-daemon

      - name: Upload TV debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.release != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: enktel-tv-debug-apk
          path: androidtv/app/build/outputs/apk/tv/debug/app-tv-debug.apk
          if-no-files-found: warn

      - name: Upload Mobile debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.release != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: enktel-mobile-debug-apk
          path: androidtv/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
          if-no-files-found: warn

      # ---- Release-only steps below (workflow_dispatch with release=true) ----

      - name: Set up Android SDK build-tools
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;37.0.0 platforms;android-37.1'

      - name: Decode release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        run: |
          if [ -z "${{ secrets.ENKTEL_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ENKTEL_KEYSTORE_BASE64 secret is not set. See ENKTEL_BUILD_AUDIT.md section 2." >&2
            exit 1
          fi
          echo "${{ secrets.ENKTEL_KEYSTORE_BASE64 }}" | base64 -d > "$ENKTEL_KEYSTORE"
          test -s "$ENKTEL_KEYSTORE"

      - name: Build signed release APKs (tv + mobile)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        run: ./gradlew :app:assembleTvRelease :app:assembleMobileRelease --no-daemon

      - name: Verify APK signatures
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        run: |
          # apksigner lives under a versioned build-tools directory, so naming
          # a generation here is a pin that has to be remembered every time the
          # compile target moves. It wasn't: this said 36.0.0 while the build
          # installed 37.0.0, the path did not exist, and every signed release
          # was verified by the fallback below. Take the newest installed one
          # and fail loudly, rather than carry a path expected to miss.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No apksigner found under $ANDROID_HOME/build-tools." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/tv/release/app-tv-release.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/mobile/release/app-mobile-release.apk

      - name: Clean up keystore file
        if: always()
        run: rm -f "$ENKTEL_KEYSTORE"

      - name: Upload TV release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: enktel-tv-release-apk
          path: androidtv/app/build/outputs/apk/tv/release/app-tv-release.apk
          if-no-files-found: error

      - name: Upload Mobile release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: enktel-mobile-release-apk
          path: androidtv/app/build/outputs/apk/mobile/release/app-mobile-release.apk
          if-no-files-found: error
