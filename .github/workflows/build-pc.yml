name: Build & Sign Windows MSI

on:
  push:
    branches: [main]
    paths:
      - 'pc/**'
      - '.github/workflows/build-pc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pc/**'
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the MSI + NSIS with the WINDOWS_PFX_BASE64 cert (requires cert secrets)'
        type: boolean
        default: false

# The Tauri build produces both `.msi` (WiX) and `.nsis` targets — installers
# for either flavour of Windows distribution channel. Icons are generated at
# build time from a placeholder PNG created by PowerShell + System.Drawing so
# the repo stays free of binary blobs the design team hasn't finalised yet.

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
        shell: pwsh
    env:
      # Bundle-signing envs picked up by tauri.conf.json → bundle.windows.signCommand
      # when the secrets are set. Empty on PR builds / forks → unsigned MSI.
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      WINDOWS_PFX_THUMBPRINT: ${{ secrets.WINDOWS_PFX_THUMBPRINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 20 is past end-of-life, so CI was building the desktop app on a
      # runtime that no longer gets security fixes. 22 is the active LTS that
      # Vite 5 actually lists as supported — 24 is also LTS but postdates
      # Vite 5.3, and 25 is a Current release, which is not what a signed
      # desktop build should be produced on.
      - name: Set up Node 22 (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pc/package-lock.json

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc/src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Generate placeholder icons if missing
        # Tauri needs a full set of icons (icon.ico, .icns, 32/128/128@2x .png)
        # to bundle. Design hasn't shipped the final artwork yet; we synthesise
        # a solid-colour placeholder from PowerShell + System.Drawing and fan
        # it out with `tauri icon` so builds don't block on artwork.
        run: |
          $iconsDir = "src-tauri/icons"
          if (-not (Test-Path "$iconsDir/icon.png")) {
            New-Item -ItemType Directory -Force -Path $iconsDir | Out-Null
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap 1024, 1024
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $bg = [System.Drawing.Color]::FromArgb(255, 5, 6, 8)         # Obsidian bg
            $accent = [System.Drawing.Color]::FromArgb(255, 56, 189, 248) # Obsidian primary
            $g.Clear($bg)
            $brush = New-Object System.Drawing.SolidBrush $accent
            # 4-arg form (GraphicsUnit::Pixel) is unambiguous — the 3-arg
            # form is ambiguous between Font(string, float, FontStyle) and
            # Font(string, float, GraphicsUnit) since both trailing enums
            # coerce from an enum literal in PowerShell.
            $font = New-Object System.Drawing.Font("Segoe UI", [Single]320, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
            $sf = New-Object System.Drawing.StringFormat
            $sf.Alignment = [System.Drawing.StringAlignment]::Center
            $sf.LineAlignment = [System.Drawing.StringAlignment]::Center
            $rect = New-Object System.Drawing.RectangleF 0, 0, 1024, 1024
            $g.DrawString("E", $font, $brush, $rect, $sf)
            $sourcePath = Join-Path (Resolve-Path $iconsDir) "source.png"
            $bmp.Save($sourcePath, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host "Wrote placeholder icon: $sourcePath"
            npx tauri icon "$sourcePath"
          } else {
            Write-Host "Icons already present, skipping generation"
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Set up Windows SDK signtool (release only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true' }}
        uses: microsoft/setup-msbuild@v3

      - name: Decode signing certificate (release only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            Write-Host "::error::WINDOWS_PFX_BASE64 secret is not set — cannot sign."
            exit 1
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "enktel-code-signing.pfx"
          $bytes = [System.Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          # Import the cert into the CurrentUser store so signtool can find it
          # by thumbprint (Tauri's bundle.windows.signCommand references the
          # store, not the .pfx directly).
          $securePwd = ConvertTo-SecureString -String $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd | Out-Null

      - name: Build (signed release)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true' }}
        # Tauri picks up TAURI_SIGNING_PRIVATE_KEY from env — we use its
        # per-bundle signCommand override to shell out to signtool with the
        # thumbprint of the just-imported cert. RFC-3161 timestamp URL keeps
        # the signature valid past the cert's own expiry.
        env:
          TAURI_BUNDLE__WINDOWS__SIGNCOMMAND: >-
            signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256
            /sha1 %WINDOWS_PFX_THUMBPRINT% %1
        run: npm run tauri:build -- --verbose

      - name: Build (unsigned)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.sign != 'true' }}
        run: npm run tauri:build -- --verbose

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: enktel-pc-msi
          path: pc/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          name: enktel-pc-nsis
          path: pc/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Verify signatures (signed release only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true' }}
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe | Select-Object -First 1
          if ($msi) { Get-AuthenticodeSignature $msi.FullName | Format-List }
          if ($nsis) { Get-AuthenticodeSignature $nsis.FullName | Format-List }

      - name: Clean up certificate
        if: always() && env.PFX_PATH != ''
        run: |
          if (Test-Path $env:PFX_PATH) { Remove-Item -Force $env:PFX_PATH }
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $env:WINDOWS_PFX_THUMBPRINT } |
            Remove-Item -Force -ErrorAction SilentlyContinue
