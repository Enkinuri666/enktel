name: Build Media3 FFmpeg audio decoder

# Produces the media3 FFmpeg audio extension AAR, which is the only way to get
# AC-3, E-AC-3, DTS and TrueHD decoding onto devices whose SoC will not do it.
# Google publishes this decoder as source in the media3 tree and not to Maven
# (confirmed against the live group index in #121), so it has to be compiled.
#
# PlayerEngine already asks for EXTENSION_RENDERER_MODE_PREFER, and
# DefaultRenderersFactory discovers FfmpegAudioRenderer by reflection, so once
# the AAR is a dependency the existing "HW+" setting starts meaning something
# with no player changes at all.
#
# PATENTS, not licences. The FFmpeg code is LGPL and fine to ship. AC-3/E-AC-3
# (Dolby) and DTS (Xperi) are patent-encumbered, and this app is distributed
# commercially. Dropping them is a one-line edit to the decoders input below,
# and everything else in the default set is unencumbered.
#
# This is a build, not a release: the AAR lands as a workflow artifact so it
# can be inspected and size-checked before anything depends on it.

on:
  # A media3 bump is the one change that invalidates the committed decoder, and
  # it is also the change least likely to prompt anyone to think about it. So
  # touching the version catalogue builds the extension against the new version
  # — no commit, just proof that a decoder for it can be produced at all before
  # the bump is merged. build-apk.yml separately refuses a version mismatch.
  pull_request:
    branches: [main]
    paths:
      - 'androidtv/gradle/libs.versions.toml'
      - '.github/workflows/build-ffmpeg-extension.yml'
  workflow_dispatch:
    inputs:
      media3_ref:
        description: 'androidx/media tag to build from. Empty reads the media3 version from the app version catalogue, which is almost always what you want.'
        type: string
        default: ''
      ffmpeg_branch:
        description: 'FFmpeg release branch'
        type: string
        default: 'release/6.0'
      api_level:
        description: 'Android API level to compile against. Must not exceed the app minSdk (23). The script builds every ABI itself.'
        type: string
        default: '23'
      decoders:
        description: 'FFmpeg decoders to enable. ac3/eac3/dca/mlp/truehd are the patent-encumbered ones.'
        type: string
        default: 'vorbis opus flac alac pcm_mulaw pcm_alaw mp3 aac ac3 eac3 dca mlp truehd'
      commit_branch:
        description: 'Branch to commit the AAR to. Empty means build only, which is the default because a 3 MB binary should not land in the repo by accident.'
        type: string
        default: ''

# contents: write only so the runner can push the AAR when commit_branch is
# set. Workflow artifacts are served from a host unreachable from the
# environment this is driven from, so the runner committing is the only way
# the binary gets into the repository without a human relaying it by hand.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: app

      # On a pull_request there are no dispatch inputs at all, so every value
      # needs a source that does not depend on someone having typed it. The
      # media3 version comes from the app's own version catalogue, which is
      # also the right default for a manual run — building against anything
      # else produces a decoder the app cannot use.
      - name: Resolve build parameters
        id: cfg
        env:
          IN_REF: ${{ inputs.media3_ref }}
          IN_FFMPEG: ${{ inputs.ffmpeg_branch }}
          IN_API: ${{ inputs.api_level }}
          IN_DECODERS: ${{ inputs.decoders }}
        run: |
          REF="$IN_REF"
          if [ -z "$REF" ]; then
            REF="$(grep -oP '^media3\s*=\s*"\K[^"]+' app/androidtv/gradle/libs.versions.toml | head -1)"
            echo "media3_ref not given; using $REF from the version catalogue"
          fi
          if [ -z "$REF" ]; then
            echo "::error::Could not determine a media3 version to build against." >&2
            exit 1
          fi
          {
            echo "ref=$REF"
            echo "ffmpeg=${IN_FFMPEG:-release/6.0}"
            echo "api=${IN_API:-23}"
            echo "decoders=${IN_DECODERS:-vorbis opus flac alac pcm_mulaw pcm_alaw mp3 aac ac3 eac3 dca mlp truehd}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out androidx/media
        uses: actions/checkout@v7
        with:
          repository: androidx/media
          ref: ${{ steps.cfg.outputs.ref }}
          path: media

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an NDK, but which one moves over time and the
      # build script needs an explicit path rather than a guess.
      - name: Locate the NDK
        id: ndk
        run: |
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            NDK="$ANDROID_NDK_HOME"
          else
            NDK="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::No Android NDK found on the runner." >&2
            exit 1
          fi
          echo "path=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK at $NDK"

      # First run is a discovery run: the layout of build_ffmpeg.sh and the
      # module name have moved between media3 versions, so show what is
      # actually here rather than failing twenty minutes later on a wrong path.
      - name: Show the decoder_ffmpeg layout
        run: |
          JNI="media/libraries/decoder_ffmpeg/src/main/jni"
          if [ ! -d "$JNI" ]; then
            echo "::error::$JNI does not exist at ref ${{ steps.cfg.outputs.ref }}. Check the tag and the module path." >&2
            find media/libraries -maxdepth 1 -name 'decoder*' -type d || true
            exit 1
          fi
          ls -la "$JNI"

          # The previous run's grep found nothing because it guessed at which
          # settings file exists. List them, then search whichever are there —
          # the AAR step needs the real module name, not a guess.
          echo "--- settings files present ---"
          ls -la media/*.gradle media/*.gradle.kts 2>/dev/null || true
          # Grepping for the literal 'decoder_ffmpeg' found nothing last run,
          # so the module include is computed rather than spelled out. Print
          # settings.gradle.kts outright — it is small, and it is the only
          # thing that says what the Gradle module is actually called.
          echo "--- settings.gradle.kts ---"
          cat media/settings.gradle.kts 2>/dev/null || true

          echo "--- build_ffmpeg.sh argument contract ---"
          grep -n '^\(FFMPEG_MODULE_PATH\|NDK_PATH\|HOST_PLATFORM\|ANDROID_ABI\|ENABLED_DECODERS\)=' \
            "$JNI/build_ffmpeg.sh"
          echo "--- where it expects ffmpeg to be ---"
          grep -n 'FFMPEG_MODULE_PATH' "$JNI/build_ffmpeg.sh" | head -10

      - name: Fetch FFmpeg
        run: |
          cd media/libraries/decoder_ffmpeg/src/main/jni
          git clone --depth 1 --branch "${{ steps.cfg.outputs.ffmpeg }}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg
          echo "FFmpeg at $(git -C ffmpeg describe --tags --always)"

      - name: Build libffmpeg for each ABI
        env:
          NDK: ${{ steps.ndk.outputs.path }}
          API_LEVEL: ${{ steps.cfg.outputs.api }}
          DECODERS: ${{ steps.cfg.outputs.decoders }}
        run: |
          cd media/libraries/decoder_ffmpeg/src/main/jni
          # Positional: <module path> <NDK> <host tag> <API level> <decoders...>
          #
          # The fourth argument is named ANDROID_ABI in the script but is an
          # API level — it lands in the toolchain path as
          # armv7a-linux-androideabi<N>-clang, and the script's own error says
          # it must not exceed the app's minSdk. The script iterates the ABIs
          # itself, so there is no ABI list to pass.
          #
          # The module path is src/main, not the module root: the script looks
          # for "$FFMPEG_MODULE_PATH/jni/ffmpeg", and jni lives under src/main.
          # Passing the module root sent it to decoder_ffmpeg/jni/ffmpeg, which
          # does not exist.
          ./build_ffmpeg.sh \
            "$(cd .. && pwd)" "$NDK" "linux-x86_64" "$API_LEVEL" $DECODERS
          echo "--- produced libraries ---"
          find . \( -name '*.so' -o -name '*.a' \) -print | head -40

      - name: Assemble the AAR
        run: |
          cd media
          # :lib-decoder-ffmpeg is still a guess. If it is wrong, list the
          # real project names in the same run rather than costing a cycle.
          if ! ./gradlew :lib-decoder-ffmpeg:assembleRelease --no-daemon; then
            echo "::error::assembleRelease failed for :lib-decoder-ffmpeg. Candidate module names follow." >&2
            ./gradlew -q projects 2>/dev/null | grep -i 'ffmpeg\|decoder' || \
              ./gradlew -q projects 2>/dev/null | head -40 || true
            exit 1
          fi

      # The output directory is the last guess in this workflow — media3 has
      # used both build/ and buildout/ — so collect by search instead of by
      # path, and fail loudly if nothing turns up.
      - name: Collect the AAR
        run: |
          mkdir -p aars
          find media -name '*.aar' -print -exec cp {} aars/ \;
          if [ -z "$(ls -A aars)" ]; then
            echo "::error::Built successfully but produced no .aar — the output path assumption is wrong." >&2
            find media -name '*.aar' -o -name 'buildout' -o -name 'build' -maxdepth 4 -type d | head -20
            exit 1
          fi
          ls -la aars

      - name: Upload the AAR
        uses: actions/upload-artifact@v4
        with:
          name: media3-decoder-ffmpeg-${{ steps.cfg.outputs.ref }}
          path: aars/*.aar
          if-no-files-found: error

      - name: Commit the AAR
        if: inputs.commit_branch != ''
        env:
          BRANCH: ${{ inputs.commit_branch }}
          MEDIA3_REF: ${{ steps.cfg.outputs.ref }}
          DECODERS: ${{ steps.cfg.outputs.decoders }}
        run: |
          # Exactly one AAR, named for the media3 version it was built from —
          # a decoder built against a different media3 than the app uses is
          # the kind of mismatch that fails at runtime, not at build time.
          COUNT="$(ls -1 aars/*.aar | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one AAR, found $COUNT." >&2
            ls -la aars
            exit 1
          fi
          DEST="androidtv/app/libs/media3-decoder-ffmpeg-${MEDIA3_REF}.aar"

          cd app
          mkdir -p androidtv/app/libs
          cp ../aars/*.aar "$DEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "::notice::AAR is byte-identical to the committed one; nothing to push."
            exit 0
          fi
          git commit -m "Add the prebuilt Media3 FFmpeg audio decoder ($MEDIA3_REF)

          Built by build-ffmpeg-extension.yml from androidx/media $MEDIA3_REF
          against FFmpeg ${{ steps.cfg.outputs.ffmpeg }}, API ${{ steps.cfg.outputs.api }}.

          Decoders: $DECODERS"
          git push -u origin "$BRANCH"
          echo "Pushed $DEST to $BRANCH"
