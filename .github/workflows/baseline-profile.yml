name: Generate Baseline Profile

# Records a baseline profile by running the app on an emulator, and uploads the
# result as an artifact to be committed into app/src/main/baseline-prof.txt.
#
# BLOCKED as of AGP 9.3.1 with benchmark 1.4.1. A dispatched run reaches Gradle
# configuration and dies with:
#
#   GradleException: Module `:app` is not a supported android module.
#     at androidx.baselineprofile.gradle.utils.AgpPlugin.configureWithAndroidPlugin
#
# The plugin resolves perfectly well — it simply refuses to attach to a module
# built by an AGP it does not recognise, and 1.4.1 predates AGP 9. There is
# nothing to fix on this side; it needs a benchmark release that knows about
# AGP 9 (1.5.x, in rc at the time of writing), at which point bumping
# `benchmark` in gradle/libs.versions.toml should be the whole change.
#
# Everything else in the chain was proven working before it reached that point:
# the emulator boots, adb connects, :baselineprofile configures, and the
# signing guard in app/build.gradle.kts is satisfied by the keystore step
# below. That is why this is left in place rather than deleted — the only
# missing piece is a third-party version.
#
# Manual only, and deliberately so. It boots an emulator, which is slow and the
# least reliable thing in any Android CI setup — none of which belongs in the
# path of building an APK. The generator module is likewise excluded from the
# build unless ENKTEL_BASELINE_PROFILE is set (see settings.gradle.kts), so if
# anything here is misconfigured it cannot affect build-apk.yml.
#
# The profile is *not* committed automatically. A profile is a performance
# input, and one generated by a run nobody looked at is exactly the kind of
# thing that should not land unreviewed — an over-broad or truncated profile
# costs install time and can be slower than none at all.

on:
  workflow_dispatch:
    inputs:
      api-level:
        description: 'Emulator API level to record on'
        type: string
        default: '34'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: androidtv
    env:
      # The switch that puts :baselineprofile into the build at all.
      ENKTEL_BASELINE_PROFILE: 'true'
      # The generate task is named …ReleaseBaselineProfile, and app/build.gradle.kts
      # refuses any task with "Release" in its name unless it can sign the output.
      # That guard is right — it is what stops an unsigned release escaping — so
      # this satisfies it rather than weakening it.
      ENKTEL_KEYSTORE: ${{ github.workspace }}/enktel-release.jks
      ENKTEL_KEYSTORE_PASS: ${{ secrets.ENKTEL_KEYSTORE_PASS }}
      ENKTEL_KEY_PASS: ${{ secrets.ENKTEL_KEY_PASS }}
      ENKTEL_KEY_ALIAS: ${{ secrets.ENKTEL_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.ENKTEL_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ENKTEL_KEYSTORE_BASE64 secret is not set." >&2
            exit 1
          fi
          echo "${{ secrets.ENKTEL_KEYSTORE_BASE64 }}" | base64 -d > "$ENKTEL_KEYSTORE"
          test -s "$ENKTEL_KEYSTORE"

      # KVM has to be reachable or the emulator falls back to software
      # rendering, which is slow enough that the run times out rather than
      # fails — a much more confusing outcome.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # An AOSP image, not google_apis. Reading a profile back off the device
      # needs a debuggable build of Android; the Play-flavoured images refuse.
      - name: Generate the profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: aosp_atd
          arch: x86_64
          profile: pixel
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: androidtv
          script: ./gradlew :app:generateTvReleaseBaselineProfile --no-daemon --stacktrace

      - name: Clean up keystore file
        if: always()
        run: rm -f "$ENKTEL_KEYSTORE"

      - name: Show what was produced
        if: always()
        run: |
          echo "--- generated profiles ---"
          find . -name 'baseline-prof.txt' -o -name '*.txt' -path '*generated*baselineProfiles*' | sort
          for f in $(find . -path '*generated*baselineProfiles*' -name '*.txt'); do
            echo "== $f ($(wc -l < "$f") rules) =="
            head -20 "$f"
          done

      - name: Upload the profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: androidtv/app/src/**/generated/baselineProfiles/*.txt
          if-no-files-found: warn
